name: Dump Supabase DB

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get install -y postgresql-client

      - name: Verificar conectividad al pooler
        run: |
          echo "Verificando IPv4 del pooler..."
          dig +short A aws-0-us-east-1.pooler.supabase.com | head -3
          nc -zv aws-0-us-east-1.pooler.supabase.com 5432 2>&1 || echo "Puerto 5432 no accesible"
          nc -zv aws-0-us-east-1.pooler.supabase.com 6543 2>&1 || echo "Puerto 6543 no accesible"

      - name: Ejecutar pg_dump via Session Pooler (puerto 5432)
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          PGPASSWORD="${DB_PASSWORD}" pg_dump \
            -h aws-0-us-east-1.pooler.supabase.com \
            -p 5432 \
            -U "postgres.hxhmvkxzfehbcvaumyjl" \
            -d postgres \
            --schema=public \
            --no-owner \
            --no-acl \
            --lock-wait-timeout=120000 \
            -f dump_completo.sql
          echo "✅ Dump completado. Tamaño: $(du -sh dump_completo.sql)"

      - name: Subir dump como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump-supabase-${{ github.run_number }}
          path: dump_completo.sql
          retention-days: 7