name: Dump Supabase DB

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Ejecutar pg_dump via Session Pooler
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          PGPASSWORD="${DB_PASSWORD}" pg_dump \
            -h aws-1-us-east-1.pooler.supabase.com \
            -p 5432 \
            -U "postgres.hxhmvkxzfehbcvaumyjl" \
            -d postgres \
            --schema=public \
            --no-owner \
            --no-acl \
            -f dump_completo.sql
          echo "✅ Dump completado. Tamaño: $(du -sh dump_completo.sql)"

      - name: Subir dump como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump-supabase-${{ github.run_number }}
          path: dump_completo.sql
          retention-days: 7